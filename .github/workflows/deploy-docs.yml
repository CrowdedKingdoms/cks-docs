name: Deploy Docs to S3 and CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-2
  S3_BUCKET: crowded-kingdoms-docs
  CLOUDFRONT_DISTRIBUTION_ID: E2YPEQES1PFPQN

jobs:
  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        run: npm ci

      - name: Build docs
        # `npx docusaurus build` skips npm prebuild; committed GraphQL reference is used in CI.
        run: npx docusaurus build

      - name: Sync to S3
        run: |
          aws s3 sync build/ s3://${{ env.S3_BUCKET }} --delete --exact-timestamps
          echo "Docs deployed to S3 bucket: ${{ env.S3_BUCKET }}"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "CloudFront invalidation created for distribution: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}"

      - name: Deployment complete
        run: |
          echo "Docs deployment completed successfully"
          echo "S3 bucket: ${{ env.S3_BUCKET }}"
          echo "CloudFront distribution: ${{ env.CLOUDFRONT_DISTRIBUTION_ID }}"
