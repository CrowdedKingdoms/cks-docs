name: Docs CI

# Pull-request guard for the public docs site. Validates that the committed GraphQL
# reference + content build cleanly (onBrokenLinks: 'throw' catches broken cross-links),
# and that every public root field/argument in the published SDL carries a description.
# Note: `npx docusaurus build` skips the npm `prebuild`, so it uses the committed
# reference/SDL (the sibling API repos are not checked out here). Maintainers regenerate
# the reference + SDL locally with `npm run build` (which runs graphql:gen + sdl:gen).
#
# THAT LAST SENTENCE IS WHY `check:generated` EXISTS. 2364 generated files are committed
# and were regenerated only when somebody remembered; on 2026-08-21 the published SDL went
# on serving `Throws CONFLICT` for a refusal that no longer carried that code, hours after
# the prose about it had been corrected. `check:generated` re-runs the generators and
# refuses on a difference. It runs the two IN-REPO hops here and says out loud that it
# cannot see the third — whether static/schema/*.graphql still match the sibling repos
# they are copied from, which needs a checkout of the PRIVATE cks-game-api from this
# PUBLIC repo. That hop is the one that catches the drift above, and it currently runs
# only from the wrapper's Loop A on an operator's box. See the script's header.
#
# Triggers are deliberately unrestricted by branch. This used to be `pull_request` against
# `main` alone, which under the three-branch model would have run NOTHING on a PR into dev,
# test or prod — the checks would have gone quiet without ever reporting a failure, which is
# the worst way for a gate to stop working. `push: ["**"]` additionally covers the promotion
# merges themselves (dev -> test -> prod), which arrive as pushes and would otherwise ship a
# broken build straight to the branch a `prod/` tag is cut from.

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-lint:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint schema descriptions (published SDL)
        run: npm run lint:schema

      # Proves its own refusal before being trusted: three fixtures, one of which
      # asserts sdl:gen still COPIES the game SDL rather than transforming it, because
      # the wrapper's cheap byte comparison depends on that and nothing else would say
      # so. ~1s.
      - name: Prove the generated-artefact gate still refuses
        run: npm run check:generated -- --self-test

      # ~30s: re-derives the management SDL and regenerates all 2361 reference pages,
      # then diffs. Exits 3 rather than 0 if it could not run at all.
      - name: Committed generated files match their generators
        run: npm run check:generated

      - name: Build docs (link + MDX gate)
        run: npx docusaurus build

      - name: Smoke-test example operations (skips without a sandbox)
        run: npm run test:examples
        env:
          SANDBOX_GRAPHQL_URL: ${{ secrets.SANDBOX_GRAPHQL_URL }}
          SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
