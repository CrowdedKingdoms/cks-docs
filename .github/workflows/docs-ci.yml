name: Docs CI

# Pull-request guard for the public docs site. Validates that the committed GraphQL
# reference + content build cleanly (onBrokenLinks: 'throw' catches broken cross-links),
# and that every public root field/argument in the published SDL carries a description.
# Note: `npx docusaurus build` skips the npm `prebuild`, so it uses the committed
# reference/SDL (the sibling API repos are not checked out here). Maintainers regenerate
# the reference + SDL locally with `npm run build` (which runs graphql:gen + sdl:gen).
#
# THAT LAST SENTENCE IS WHY `check:generated` EXISTS. 2364 generated files are committed
# and were regenerated only when somebody remembered; on 2026-08-21 the published SDL went
# on serving `Throws CONFLICT` for a refusal that no longer carried that code, hours after
# the prose about it had been corrected. `check:generated` re-runs the generators and
# refuses on a difference. It runs the two IN-REPO hops here and says out loud that it
# cannot see the third — whether static/schema/*.graphql still match the sibling repos
# they are copied from, which needs a checkout of the PRIVATE cks-game-api from this
# PUBLIC repo. That hop is the one that catches the drift above, and it currently runs
# only from the wrapper's Loop A on an operator's box. See the script's header.
#
# Triggers are deliberately unrestricted by branch. This used to be `pull_request` against
# `main` alone, which under the three-branch model would have run NOTHING on a PR into dev,
# test or prod — the checks would have gone quiet without ever reporting a failure, which is
# the worst way for a gate to stop working. `push: ["**"]` additionally covers the promotion
# merges themselves (dev -> test -> prod), which arrive as pushes and would otherwise ship a
# broken build straight to the branch a `prod/` tag is cut from.

on:
  pull_request:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-and-lint:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # WHAT THIS PUBLIC REPO PUBLISHES, checked for internal references. It ran
      # nowhere until 2026-08-24, while both SDKs generated from the same upstream
      # schema had such a gate — and the asymmetry was the defect rather than any
      # single reference, because the copy nobody had gated is the one where a
      # sealed-repo name was eventually found. Reads the committed tree, needs no
      # build, and refuses in under a second.
      #
      # It deliberately does NOT gate `cks-game-api`: that would have needed an
      # allowlist on its first run, which is a statement about the term rather than
      # the corpus. The script's header has the full reasoning, written down so the
      # next reader does not have to guess — guessing is what produced the
      # schema.gql exemption this gate's sibling carried for weeks.
      - name: Prove the content-policy gate still refuses
        run: npm run check:content-policy:self-test

      - name: No internal references in published content
        run: npm run check:content-policy

      - name: Lint schema descriptions (published SDL)
        run: npm run lint:schema

      # Proves its own refusal before being trusted: three fixtures, one of which
      # asserts sdl:gen still COPIES the game SDL rather than transforming it, because
      # the wrapper's cheap byte comparison depends on that and nothing else would say
      # so. ~1s.
      - name: Prove the generated-artefact gate still refuses
        run: npm run check:generated -- --self-test

      # ~30s: re-derives the management SDL and regenerates all 2361 reference pages,
      # then diffs. Exits 3 rather than 0 if it could not run at all.
      - name: Committed generated files match their generators
        run: npm run check:generated

      # Local `prebuild` already runs this; Docs CI used to skip it because the
      # build step is `npx docusaurus build` (no npm prebuild). No secrets.
      - name: Game-API mapping lint
        run: npm run lint:game-api-mapping

      # CKS_DOCS_TIER IS REQUIRED AND HAS NO DEFAULT, so this step has to supply one, and
      # which one it supplies is part of what the gate checks. Since 2026-08-23 there are
      # three docs sites, one per branch, and the tier decides the canonical URL, the
      # sitemap, the non-production banner and the `noindex` meta tag. Build the wrong one
      # and everything passes while the artifact is wrong.
      #
      # ON A PULL REQUEST THIS READS THE BASE, not the head. A `dev` -> `test` promotion
      # must be judged by TEST's rule before the merge, which is the same reasoning as
      # Crowdy-Games' SDK-pin gate. On a push it is the branch itself.
      #
      # A BRANCH THAT IS NOT A TIER BUILDS AS `dev`, deliberately and only here. This
      # workflow runs on `branches: ["**"]`, so a feature branch has no tier of its own,
      # and the alternative to a choice is the build failing on every feature branch —
      # which would make this gate stop reporting, the exact failure the trigger comment
      # above exists to prevent. `dev` is the safe pick: every tier's build exercises the
      # same 2361 pages and the same links, so what the gate measures does not depend on
      # the tier, and the two things that DO differ (the canonical host and the banner)
      # are not published from here. Nothing deploys from this workflow.
      - name: Resolve the docs tier from the branch
        id: tier
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.ref_name }}
        run: |
          branch="${BASE:-$HEAD}"
          case "$branch" in
            dev | test | prod) tier="$branch" ;;
            *) tier=dev; echo "::notice::'$branch' is not a tier branch; building as dev" ;;
          esac
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "building the $tier docs site (branch '$branch')"

      - name: Build docs (link + MDX gate)
        run: npx docusaurus build
        env:
          CKS_DOCS_TIER: ${{ steps.tier.outputs.tier }}

      - name: Smoke-test example operations (skips without a sandbox)
        run: npm run test:examples
        env:
          SANDBOX_GRAPHQL_URL: ${{ secrets.SANDBOX_GRAPHQL_URL }}
          SANDBOX_TOKEN: ${{ secrets.SANDBOX_TOKEN }}
          SANDBOX_APP_TOKEN: ${{ secrets.SANDBOX_APP_TOKEN }}
          SANDBOX_APP_ID: ${{ secrets.SANDBOX_APP_ID }}
