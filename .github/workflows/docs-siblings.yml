name: Docs siblings check

# Hop 1 of check:generated — compare committed SDLs to private/public sibling
# checkouts. Needs a read PAT that can clone cks-game-api. Still NOT on every PR:
# token blast radius. Manual, weekly, and on promotion pull requests.
#
# Tier alignment: sibling checkouts use the SAME tier branch as the docs ref
# under test (dev↔dev, test↔test, prod↔prod). Feature branches default to dev.
#
# WHY PROMOTION PULL REQUESTS WERE ADDED, AND WHY THAT KEEPS THE BLAST RADIUS SMALL.
# On a weekly-only schedule, a tier's published SDL could disagree with that tier's API for up
# to seven days, and the moment it matters most is the one this never covered: a promotion
# into test or prod is exactly when the docs and the API arrive at a tier together, and it was
# checked afterwards or not at all.
#
# The original reasoning stands and is not being overridden. This does not run on every PR: it
# runs only on PRs whose BASE is test or prod, which are promotions by definition -- a handful
# a week, all from branches inside this repository. A pull_request from a fork receives no
# secrets in Actions, so the token cannot leave with an outside contributor; that case takes the
# clean skip below rather than leaking.

on:
  workflow_dispatch:
    inputs:
      tier:
        description: 'Sibling tier branch to check out (dev|test|prod)'
        required: true
        default: 'dev'
        type: choice
        options: [dev, test, prod]
  pull_request:
    branches: [test, prod]
  schedule:
    # Mondays 14:00 UTC — quiet window; fail loud if SDL drifted vs siblings
    - cron: '0 14 * * 1'

jobs:
  siblings:
    name: check:generated:siblings
    runs-on: ubuntu-latest
    steps:
      - name: Resolve sibling tier
        id: tier
        env:
          INPUT_TIER: ${{ inputs.tier }}
          BASE_REF: ${{ github.base_ref }}
          REF: ${{ github.ref_name }}
        run: |
          # BASE_REF before REF, and it is not a nicety. On a pull_request, github.ref_name is
          # the merge ref -- "123/merge" -- which matches no tier and would have fallen through
          # to the dev default, so a promotion into prod would have been checked against DEV's
          # siblings and reported green. The base branch is the tier the merged result lands on,
          # which is the only tier whose SDL this run can speak for.
          if [ -n "$INPUT_TIER" ]; then
            tier="$INPUT_TIER"; from="workflow_dispatch input"
          elif [ -n "$BASE_REF" ]; then
            case "$BASE_REF" in
              dev|test|prod) tier="$BASE_REF"; from="the pull request base" ;;
              *) tier=dev; from="the dev default (base '$BASE_REF' names no tier)" ;;
            esac
          else
            case "$REF" in
              dev|test|prod) tier="$REF"; from="the pushed branch" ;;
              *) tier=dev; from="the dev default (ref '$REF' names no tier)" ;;
            esac
          fi
          echo "tier=$tier" >> "$GITHUB_OUTPUT"
          echo "sibling tier=$tier, from $from"

      - name: Checkout cks-docs
        uses: actions/checkout@v4
        with:
          path: cks-docs

      # Secret name: CKS_REPO_READ_TOKEN — fine-scoped PAT (or app token) that
      # can read CrowdedKingdoms/cks-game-api (private) and CrowdyJS (public).
      # Operator must set this in repo secrets; workflow skips cleanly if unset.
      - name: Require sibling read token
        id: token
        env:
          TOKEN: ${{ secrets.CKS_REPO_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::CKS_REPO_READ_TOKEN unset — siblings check cannot run from this public repo"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout cks-game-api (same tier)
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: CrowdedKingdoms/cks-game-api
          ref: ${{ steps.tier.outputs.tier }}
          token: ${{ secrets.CKS_REPO_READ_TOKEN }}
          path: cks-game-api

      - name: Checkout CrowdyJS (same tier)
        if: steps.token.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: CrowdedKingdoms/CrowdyJS
          ref: ${{ steps.tier.outputs.tier }}
          token: ${{ secrets.CKS_REPO_READ_TOKEN }}
          path: CrowdyJS

      - name: Setup Node.js
        if: steps.token.outputs.available == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: cks-docs/package-lock.json

      - name: Install + check siblings
        if: steps.token.outputs.available == 'true'
        working-directory: cks-docs
        run: |
          npm ci
          npm run check:generated:siblings -- --sibling-root="$GITHUB_WORKSPACE"

      - name: Skip notice
        if: steps.token.outputs.available != 'true'
        run: echo "Set repo secret CKS_REPO_READ_TOKEN to enable this job."
